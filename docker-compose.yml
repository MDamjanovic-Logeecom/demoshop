version: '3.8'

services:
  app:
    build: .
    container_name: demoshop_app
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_CHARSET: ${DB_CHARSET}
      REGISTRATION_KEY: ${REGISTRATION_KEY}
      TEST_ADMIN: ${TEST_ADMIN}
      TEST_PW: ${TEST_PW}
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]

  db:
    image: mysql:8.0
    container_name: demoshop_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
